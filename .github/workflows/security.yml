name: security-audit

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all application and test modules
        run: python -m compileall -q sellbird tests
      - name: Install dependency auditor
        run: python -m pip install --upgrade "pip-audit>=2.7,<3"
      - name: Audit direct and transitive dependencies
        run: pip-audit --strict -r requirements.txt
